<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 450" width="940" height="450" role="img" aria-label="Anatomia de um workflow do GitHub Actions">
<title>Anatomia de um workflow do GitHub Actions</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="940" height="450" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Anatomia de um workflow do GitHub Actions</text>
<rect x="30" y="80" width="170" height="110" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="115.0" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">⚡ evento</text>
<text x="115.0" y="126" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">push, pull_request,</text>
<text x="115.0" y="144" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">schedule, manual…</text>
<text x="115.0" y="162" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748b">on:</text>
<rect x="240" y="80" width="190" height="110" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="335.0" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">📄 workflow</text>
<text x="335.0" y="126" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">um arquivo YAML em</text>
<text x="335.0" y="144" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">.github/workflows/</text>
<text x="335.0" y="162" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748b">ci.yml</text>
<rect x="470" y="60" width="200" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="570.0" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">🧱 job “testes”</text>
<text x="570.0" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">roda num runner</text>
<text x="570.0" y="124" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748b">runs-on: ubuntu-latest</text>
<rect x="470" y="170" width="200" height="90" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="570.0" y="196" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">🧱 job “deploy”</text>
<text x="570.0" y="216" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">needs: testes</text>
<text x="570.0" y="234" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748b">environment: prod</text>
<rect x="710" y="60" width="200" height="200" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="810.0" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">👣 steps</text>
<text x="810.0" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">em sequência,</text>
<text x="810.0" y="124" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">na MESMA máquina</text>
<text x="810.0" y="142" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">uses: ação pronta</text>
<text x="810.0" y="160" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">run: comando de shell</text>
<text x="810.0" y="178" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748b">actions/checkout@&lt;sha&gt;</text>
<text x="810.0" y="195" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748b">run: npm test</text>
<path d="M200 135 L238 135" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<path d="M430 120 L468 105" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<path d="M430 150 L468 210" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<path d="M570 152 L570 168" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<path d="M670 105 L708 120" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<rect x="30" y="300" width="880" height="110" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
<text x="470.0" y="326" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">🖥️ runner (máquina descartável) + contextos</text>
<text x="470.0" y="346" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">github.* (quem, o quê, onde) · env.* · vars.* · secrets.* · steps.&lt;id&gt;.outputs · needs.&lt;job&gt;.outputs</text>
<text x="470.0" y="364" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">GITHUB_TOKEN automático com as permissões que você declarar em permissions:</text>
<text x="470.0" y="382" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748b">${{ github.ref_name }}  ${{ secrets.NPM_TOKEN }}  $GITHUB_OUTPUT  $GITHUB_STEP_SUMMARY</text>
<text x="916" y="436" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">© 2026 Prof. Daniel Santos · CC BY-NC-SA 4.0</text>
</svg>
