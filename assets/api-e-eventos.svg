<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 420" width="920" height="420" role="img" aria-label="Conversando com o GitHub por programa: API, gh e webhooks">
<title>Conversando com o GitHub por programa: API, gh e webhooks</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="920" height="420" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Conversando com o GitHub por programa: API, gh e webhooks</text>
<rect x="30" y="80" width="240" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="150.0" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">🧑‍💻 seu script</text>
<text x="150.0" y="126" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">curl, gh api, Octokit,</text>
<text x="150.0" y="144" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">PyGithub…</text>
<text x="150.0" y="162" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748b">gh api repos/o/r</text>
<rect x="340" y="60" width="240" height="190" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="460.0" y="86" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">☁️ API do GitHub</text>
<text x="460.0" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">REST: um recurso por URL</text>
<text x="460.0" y="124" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">GraphQL: uma consulta,</text>
<text x="460.0" y="142" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">só os campos que pediu</text>
<text x="460.0" y="160" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">limite: 5.000 req/h</text>
<text x="460.0" y="178" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">(token de usuário)</text>
<text x="460.0" y="196" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748b">api.github.com</text>
<rect x="650" y="80" width="240" height="150" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="770.0" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">🖥️ seu servidor</text>
<text x="770.0" y="126" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">recebe eventos em</text>
<text x="770.0" y="144" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">tempo real (POST)</text>
<text x="770.0" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">confere a assinatura</text>
<text x="770.0" y="180" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748b">X-Hub-Signature-256</text>
<path d="M270 130 L338 130" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<text x="305" y="120" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="600" fill="#0f172a">pergunta</text>
<path d="M338 180 L272 180" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<text x="305" y="200" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="600" fill="#0f172a">JSON</text>
<path d="M580 155 L648 155" stroke="#ea580c" stroke-width="2" fill="none" marker-end="url(#s)"/>
<text x="615" y="145" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="600" fill="#0f172a">webhook</text>
<text x="460" y="290" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">Quem se autentica: token pessoal (age como você) · GitHub App (age como app, permissões finas,</text>
<text x="460" y="310" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#0f172a">tokens que expiram em 1 h) · GITHUB_TOKEN (só dentro do Actions, expira no fim do job).</text>
<text x="460" y="350" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">Regra prática: leia com GraphQL quando precisar de muitos campos relacionados; escreva com REST.</text>
<text x="896" y="406" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">© 2026 Prof. Daniel Santos · CC BY-NC-SA 4.0</text>
</svg>
