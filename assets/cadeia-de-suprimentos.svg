<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" width="960" height="380" role="img" aria-label="Cadeia de suprimentos: onde cada proteção do GitHub atua">
<title>Cadeia de suprimentos: onde cada proteção do GitHub atua</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="960" height="380" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Cadeia de suprimentos: onde cada proteção do GitHub atua</text>
<rect x="25" y="90" width="140" height="130" rx="12" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/>
<text x="95.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">📦 dependências</text>
<text x="95.0" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">Dependabot alerts</text>
<text x="95.0" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">e atualizações</text>
<path d="M165 155 L183 155" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<rect x="183" y="90" width="140" height="130" rx="12" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
<text x="253.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">🔐 segredos</text>
<text x="253.0" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">secret scanning</text>
<text x="253.0" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">push protection</text>
<path d="M323 155 L341 155" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<rect x="341" y="90" width="140" height="130" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="411.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">🧪 código</text>
<text x="411.0" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">code scanning</text>
<text x="411.0" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">(CodeQL)</text>
<path d="M481 155 L499 155" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<rect x="499" y="90" width="140" height="130" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="569.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">⚙️ build</text>
<text x="569.0" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">ações fixadas por SHA</text>
<text x="569.0" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">lockfile · permissions</text>
<path d="M639 155 L657 155" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<rect x="657" y="90" width="140" height="130" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
<text x="727.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">🏷️ artefato</text>
<text x="727.0" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">attestation</text>
<text x="727.0" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">(proveniência)</text>
<path d="M797 155 L815 155" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<rect x="815" y="90" width="140" height="130" rx="12" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
<text x="885.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">🚀 release</text>
<text x="885.0" y="136" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">release imutável</text>
<text x="885.0" y="154" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">checksums</text>
<text x="480" y="265" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">Cada elo fraco é uma porta: um pacote comprometido, um token num commit,</text>
<text x="480" y="285" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">uma ação “v4” cuja tag foi movida por um atacante, um binário sem origem comprovada.</text>
<text x="480" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">SECURITY.md + relato privado de vulnerabilidade fecham o ciclo: quem acha um problema sabe como avisar.</text>
<text x="936" y="366" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">© 2026 Prof. Daniel Santos · CC BY-NC-SA 4.0</text>
</svg>
