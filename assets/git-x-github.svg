<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 430" width="900" height="430" role="img" aria-label="Git é a ferramenta; o GitHub é a plataforma em volta dela">
<title>Git é a ferramenta; o GitHub é a plataforma em volta dela</title>
<defs><marker id="s" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#475569"/></marker></defs>
<rect width="900" height="430" rx="16" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="30" y="36" text-anchor="start" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#0f172a">Git é a ferramenta; o GitHub é a plataforma em volta dela</text>
<rect x="30" y="80" width="240" height="300" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
<text x="150.0" y="106" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">💻 Git (no seu computador)</text>
<text x="150.0" y="126" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">commits, branches, merge</text>
<text x="150.0" y="144" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">histórico completo, offline</text>
<text x="150.0" y="162" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">funciona sem internet</text>
<text x="150.0" y="180" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">software livre (GPLv2)</text>
<text x="150.0" y="198" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748b">git commit · git push</text>
<rect x="630" y="70" width="240" height="320" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="750.0" y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0f172a">☁️ GitHub (na nuvem)</text>
<text x="750.0" y="116" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">hospeda repositórios Git</text>
<text x="750.0" y="134" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">+ colaboração: issues, PRs,</text>
<text x="750.0" y="152" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">  revisão, Projects, Discussions</text>
<text x="750.0" y="170" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">+ automação: Actions, Pages</text>
<text x="750.0" y="188" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">+ segurança: Dependabot,</text>
<text x="750.0" y="206" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">  secret scanning, CodeQL</text>
<text x="750.0" y="224" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#334155">+ API REST/GraphQL, webhooks</text>
<text x="750.0" y="242" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="11.5" font-weight="400" fill="#64748b">github.com · gh · API</text>
<path d="M270 180 L628 180" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<text x="450" y="170" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="600" fill="#0f172a">git push</text>
<path d="M628 260 L270 260" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#s)"/>
<text x="450" y="250" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="12" font-weight="600" fill="#0f172a">git fetch / pull</text>
<text x="450" y="320" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">O protocolo é o mesmo do Git:</text>
<text x="450" y="338" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">o GitHub é “um remoto” — mais tudo</text>
<text x="450" y="356" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600" fill="#0f172a">o que um time precisa em volta dele.</text>
<text x="450" y="390" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="400" fill="#64748b">Alternativas: GitLab · Bitbucket · Gitea/Forgejo</text>
<text x="876" y="416" text-anchor="end" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="400" fill="#94a3b8">© 2026 Prof. Daniel Santos · CC BY-NC-SA 4.0</text>
</svg>
