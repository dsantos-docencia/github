# Responde a issues novos SEM injeção: dados do evento entram por env, nunca no script.
name: Boas-vindas
on:
  issues:
    types: [opened]
permissions: {}
jobs:
  comentar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Comentar
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMERO: ${{ github.event.issue.number }}
          TITULO: ${{ github.event.issue.title }}
          AUTOR: ${{ github.event.issue.user.login }}
        run: |
          gh issue comment "$NUMERO" -R "$REPO" \
            --body "Obrigado, @$AUTOR! Recebemos: \"$TITULO\". Vamos triar em breve."
