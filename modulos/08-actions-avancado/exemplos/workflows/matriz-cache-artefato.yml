# Curso de GitHub · Módulo 08 · workflow de referência (© 2026 Prof. Daniel Santos · PolyForm-NC)
name: Matriz, cache e artefato
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: matriz-${{ github.ref }}
  cancel-in-progress: true
jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22, 24]
        exclude:
          - os: windows-latest
            node: 20
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm                    # o setup-node já usa o actions/cache por baixo
      - run: npm ci
      - run: npm test
  build:
    needs: testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      versao: ${{ steps.v.outputs.versao }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: v
        run: echo "versao=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"
      - run: npm ci && npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: dist/
          retention-days: 7
  publicar:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: producao
      url: https://loja.exemplo.dev
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist/
      - env:
          VERSAO: ${{ needs.build.outputs.versao }}
        run: echo "Publicando a versão $VERSAO" && ls dist/
