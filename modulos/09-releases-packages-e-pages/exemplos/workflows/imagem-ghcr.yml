name: Imagem no GHCR
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  packages: write
jobs:
  imagem:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construir e enviar
        env:
          IMAGEM: ghcr.io/${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" -t "$IMAGEM:$TAG" .
          docker push "$IMAGEM:$TAG"
